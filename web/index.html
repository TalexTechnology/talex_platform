<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TaleX">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TaleX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TaleX</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1528">
  <!-- Fondo del tema guardado mientras carga Flutter (ThemeCubit guarda
       'talex.theme'); la encuesta de cultura lo sobrescribe. -->
  <style>html, body { background: #0B1528; } html.light, html.light body { background: #F5F7FB; }</style>
  <script>
    try {
      if (localStorage.getItem('flutter.talex.theme') === '"light"') {
        document.documentElement.classList.add('light');
        document.querySelector('meta[name="theme-color"]').content = '#F5F7FB';
      }
    } catch (_) {}
  </script>
</head>
<body>
  <script src="culture_survey_boot.js"></script>
  <script>
    if (!window.TalexCultureBoot || !window.TalexCultureBoot.started) {
      var flutter = document.createElement('script');
      flutter.src = 'flutter_bootstrap.js';
      flutter.async = true;
      document.body.appendChild(flutter);
    }
  </script>
</body>
</html>
