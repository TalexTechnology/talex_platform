services:
  mongo:
    image: mongo:7
    container_name: talex-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - talex_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - |
        try { rs.status(); } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
        }

  api:
    build:
      context: ./server
    container_name: talex-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/talex?replicaSet=rs0}
      MONGODB_DB: ${MONGODB_DB:-talex}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-talex-platform}
      LOCAL_SUPERADMIN_EMAILS: ${LOCAL_SUPERADMIN_EMAILS:-talex.admin@talex.com.co}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  talex_mongo_data:
