services:
  mysql:
    profiles: ["embedded-db"]
    image: mysql:8.4
    container_name: talex-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talex}
      MYSQL_USER: ${MYSQL_USER:-talex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-talex0000}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-talex_root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - talex_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-talex_root_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    container_name: talex-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-talex}
      MYSQL_USER: ${MYSQL_USER:-talex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-talex0000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-talex-platform}
      LOCAL_SUPERADMIN_EMAILS: ${LOCAL_SUPERADMIN_EMAILS:-talex.admin@talex.com.co}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  talex_mysql_data:
